name: Refresh Wikidata events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"   # monthly, on the 1st
  push:
    branches: [main]
    paths:
      - scripts/build-events-wikidata.py
      - .github/workflows/events.yml

permissions:
  contents: write

concurrency:
  group: wikidata-events
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Wikidata
        run: python3 scripts/build-events-wikidata.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add events-wikidata.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh Wikidata events"
          git pull --rebase origin main
          git push origin HEAD:main
