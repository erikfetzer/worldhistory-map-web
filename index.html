<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* Layout: full-bleed map; a timeline dock pinned to the bottom; info card floats top-left. Single dark "night atlas" theme by choice. */
:root {
  --sea: #101c27;
  --void: #0a1219;
  --land: #2a3138;
  --ink: #e9e4d8;
  --muted: #98a2a8;
  --brass: #d9a95b;
  --panel: rgba(14, 22, 30, 0.88);
  --line: rgba(233, 228, 216, 0.14);
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--void); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
button, select, input { font: inherit; color: inherit; }
button, select, input[type="number"], input[type="search"] {
  background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-height: 34px;
}
button { cursor: pointer; }
button:hover, select:hover { border-color: rgba(217,169,91,0.6); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
select option { background: #16222d; }

.top { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(6px); max-width: 340px; }
.brand h1 { font-family: var(--font-display); font-weight: 650; font-size: 20px; margin: 0; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.search { display: flex; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; backdrop-filter: blur(6px); }
.search input { width: 220px; }

#info { position: fixed; right: 16px; top: 80px; width: 300px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--brass); border-radius: 10px; padding: 14px 16px; backdrop-filter: blur(6px); display: none; }
#info.show { display: block; }
#info h2 { font-family: var(--font-display); font-weight: 650; font-size: 19px; margin: 0 24px 6px 0; text-wrap: balance; }
#info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0; font-size: 13px; }
#info dt { color: var(--muted); }
#info dd { margin: 0; font-variant-numeric: tabular-nums; }
#info .links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
#info a { color: var(--brass); }
#info .close { position: absolute; top: 8px; right: 8px; min-height: 0; padding: 2px 8px; border: none; background: none; color: var(--muted); font-size: 18px; }
#info .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; white-space: nowrap; }

.dock { position: fixed; left: 16px; right: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 14px; backdrop-filter: blur(8px); display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; align-items: center; }
.yearbox { grid-row: span 2; min-width: 170px; }
#yearLabel { font-family: var(--font-display); font-weight: 650; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
#yearLabel small { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--brass); margin-left: 6px; letter-spacing: 0.06em; }
#countLabel { color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 54px; }
#spark { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 34px; }
#slider { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; margin: 0; accent-color: var(--brass); height: 20px; }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -2px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; grid-column: 1 / -1; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.controls .group { display: flex; gap: 6px; align-items: center; }
.controls label { color: var(--muted); font-size: 12px; }
#playBtn { background: var(--brass); color: #1b1408; border-color: var(--brass); font-weight: 600; min-width: 84px; }
.controls input[type="number"] { width: 78px; font-variant-numeric: tabular-nums; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.check { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.credit { margin-left: auto; font-size: 11px; color: var(--muted); }
.credit a { color: var(--muted); }

#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: var(--muted); background: var(--void); }

@media (max-width: 760px) {
  .brand p, .credit { display: none; }
  .top { flex-direction: column; }
  .search input { width: 100%; }
  .search { width: 100%; }
  .dock { grid-template-columns: 1fr; left: 8px; right: 8px; bottom: 8px; padding: 10px 12px; }
  .yearbox { grid-row: auto; display: flex; align-items: baseline; gap: 10px; }
  #yearLabel { font-size: 30px; }
  .sep { display: none; }
  #info { top: auto; bottom: 230px; left: 8px; right: 8px; width: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="map" aria-label="Map of world political borders for the selected year"></canvas>
<div id="loading">Loading 5,400 years of borders…</div>

<div class="top">
  <div class="brand">
    <h1>World History Map</h1>
    <p>Political borders from 3400 BCE to 2024 CE. Drag to pan, scroll or pinch to zoom, click a territory for details.</p>
  </div>
  <form class="search" id="searchForm">
    <input type="search" id="searchInput" list="names" placeholder="Find a polity, e.g. Roman Empire" aria-label="Find a polity">
    <datalist id="names"></datalist>
    <button type="submit">Go</button>
  </form>
</div>

<div id="info" role="dialog" aria-live="polite">
  <button class="close" id="infoClose" aria-label="Close details">×</button>
  <h2 id="infoName"></h2>
  <dl id="infoDl"></dl>
  <div class="links" id="infoLinks"></div>
</div>
<div id="tip"></div>

<div class="dock">
  <div class="yearbox">
    <div id="yearLabel">—</div>
    <div id="countLabel"></div>
  </div>
  <div>
    <div class="track">
      <canvas id="spark" aria-hidden="true"></canvas>
      <input type="range" id="slider" min="-3400" max="2024" step="1" value="117" aria-label="Year">
    </div>
    <div class="ticks"><span>3400 BCE</span><span>2000 BCE</span><span>1000 BCE</span><span>1 CE</span><span>1000 CE</span><span>2024 CE</span></div>
  </div>
  <div class="controls">
    <div class="group">
      <button id="prevChange" title="Previous border change (Shift+←)" aria-label="Previous border change">⇤</button>
      <button id="prevYear" title="Back one year (←)" aria-label="Back one year">−1</button>
      <button id="playBtn" title="Play or pause (Space)">▶ Play</button>
      <button id="nextYear" title="Forward one year (→)" aria-label="Forward one year">+1</button>
      <button id="nextChange" title="Next border change (Shift+→)" aria-label="Next border change">⇥</button>
    </div>
    <span class="sep"></span>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="changes">Each change</option>
        <option value="1">1 yr/s</option>
        <option value="5">5 yr/s</option>
        <option value="10">10 yr/s</option>
        <option value="25" selected>25 yr/s</option>
        <option value="50">50 yr/s</option>
        <option value="100">100 yr/s</option>
        <option value="250">250 yr/s</option>
      </select>
    </div>
    <span class="sep"></span>
    <div class="group">
      <label for="preset">Play range</label>
      <select id="preset">
        <option value="-3400,2024">All of history</option>
        <option value="-3400,-500">Bronze &amp; Iron Age</option>
        <option value="-800,500" selected>Classical world</option>
        <option value="500,1500">Medieval</option>
        <option value="1500,1800">Early modern</option>
        <option value="1800,2024">Modern</option>
        <option value="custom">Custom…</option>
      </select>
      <input type="number" id="fromYear" aria-label="Range start year (negative = BCE)" title="Start year (negative = BCE)">
      <label for="toYear">to</label>
      <input type="number" id="toYear" aria-label="Range end year (negative = BCE)" title="End year (negative = BCE)">
      <label class="check"><input type="checkbox" id="loop"> Loop</label>
    </div>
    <span class="sep"></span>
    <label class="check"><input type="checkbox" id="showRel"> Alliances &amp; overlords</label>
    <span class="credit">Borders: <a href="https://github.com/Seshat-Global-History-Databank/cliopatria">Cliopatria</a> (Seshat), <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, simplified for web</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(async function () {
  const MIN_Y = -3400, MAX_Y = 2024;
  const $ = (id) => document.getElementById(id);
  const canvas = $("map"), ctx = canvas.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const C = { sea: css.getPropertyValue("--sea").trim(), void: css.getPropertyValue("--void").trim(), land: css.getPropertyValue("--land").trim(), ink: css.getPropertyValue("--ink").trim(), brass: css.getPropertyValue("--brass").trim() };

  const fmt = (y) => y < 0 ? [String(-y), "BCE"] : [String(y), "CE"];
  const fmtS = (y) => fmt(y).join(" ");

  // ---------- data ----------
  let borders, landTopo;
  try {
    [borders, landTopo] = await Promise.all([fetch("borders.json").then(r => r.json()), fetch("land.json").then(r => r.json())]);
  } catch (e) {
    $("loading").textContent = "The border data could not load. Reload the page to try again.";
    return;
  }
  const objName = Object.keys(borders.objects)[0];
  const fc = topojson.feature(borders, borders.objects[objName]);
  const land = topojson.feature(landTopo, landTopo.objects.land);

  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function colorFor(name) {
    const h = hash(name);
    const hue = (h % 360);
    const sat = 38 + (h >> 9) % 22;
    const lit = 48 + (h >> 17) % 16;
    return `hsl(${hue} ${sat}% ${lit}%)`;
  }

  const feats = [];
  const spans = new Map();
  for (const f of fc.features) {
    if (!f.geometry) continue;
    const p = f.properties;
    const rel = p.Type === "RELATION";
    const o = { f, p, name: p.Name, label: p.Name.replace(/^\((.*)\)$/, "$1"), from: +p.FromYear, to: +p.ToYear, rel, color: colorFor(p.Name), path: null, bounds: null, centroid: null, area: 0 };
    feats.push(o);
    const s = spans.get(p.Name) || { from: Infinity, to: -Infinity, rows: [] };
    s.from = Math.min(s.from, o.from); s.to = Math.max(s.to, o.to); s.rows.push(o);
    spans.set(p.Name, s);
  }

  // counts per year (polities only) for sparkline
  const NY = MAX_Y - MIN_Y + 1;
  const diff = new Int32Array(NY + 2);
  for (const o of feats) if (!o.rel) { diff[o.from - MIN_Y]++; diff[o.to - MIN_Y + 1]--; }
  const counts = new Int32Array(NY); { let c = 0; for (let i = 0; i < NY; i++) { c += diff[i]; counts[i] = c; } }

  // years where anything changes
  const changeSet = new Set();
  for (const o of feats) { changeSet.add(o.from); if (o.to + 1 <= MAX_Y) changeSet.add(o.to + 1); }
  const changes = [...changeSet].sort((a, b) => a - b);

  // search list
  const dl = $("names");
  [...spans.keys()].filter(n => !n.startsWith("(")).sort().forEach(n => { const op = document.createElement("option"); op.value = n; dl.appendChild(op); });

  // ---------- projection & geometry cache ----------
  let W = 0, H = 0, dpr = 1;
  const projection = d3.geoNaturalEarth1();
  const geoPath = d3.geoPath(projection);
  let spherePath, landPath, gratPath;
  const graticule = d3.geoGraticule10();

  function fixWinding(f) {
    // d3 expects clockwise exterior rings; a polygon covering most of the globe means rings are reversed
    if (d3.geoArea(f) > 2 * Math.PI) {
      const g = f.geometry;
      const rev = (poly) => poly.map(r => r.slice().reverse());
      if (g.type === "Polygon") g.coordinates = rev(g.coordinates);
      else if (g.type === "MultiPolygon") g.coordinates = g.coordinates.map(rev);
    }
  }
  let windingChecked = false;
  function ensure(o) {
    if (o.path) return o;
    if (!o.checked) { fixWinding(o.f); o.checked = true; }
    const p = new Path2D();
    d3.geoPath(projection, p)(o.f);
    o.path = p;
    o.bounds = geoPath.bounds(o.f);
    o.area = geoPath.area(o.f);
    // label anchor: centroid of the largest part
    let target = o.f;
    if (o.f.geometry.type === "MultiPolygon") {
      let best = null, ba = -1;
      for (const poly of o.f.geometry.coordinates) {
        const pf = { type: "Feature", geometry: { type: "Polygon", coordinates: poly } };
        const a = geoPath.area(pf);
        if (a > ba) { ba = a; best = pf; }
      }
      target = best; o.labelArea = ba;
    } else o.labelArea = o.area;
    o.centroid = geoPath.centroid(target);
    return o;
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const dockH = document.querySelector(".dock").offsetHeight + 24;
    projection.fitExtent([[12, 12], [W - 12, Math.max(200, H - dockH)]], { type: "Sphere" });
    spherePath = new Path2D(); d3.geoPath(projection, spherePath)({ type: "Sphere" });
    landPath = new Path2D(); d3.geoPath(projection, landPath)(land);
    gratPath = new Path2D(); d3.geoPath(projection, gratPath)(graticule);
    for (const o of feats) o.path = null;
    sizeSpark();
    draw();
  }

  // ---------- state ----------
  let year = 117;
  let visible = [];
  let transform = d3.zoomIdentity;
  let selected = null, hovered = null;
  let showRel = false;

  function computeVisible() {
    visible = feats.filter(o => o.from <= year && year <= o.to && (showRel || !o.rel));
    for (const o of visible) ensure(o);
    visible.sort((a, b) => (a.rel - b.rel) || (b.area - a.area));
  }

  // ---------- drawing ----------
  let drawQueued = false;
  function draw() {
    if (drawQueued) return; drawQueued = true;
    requestAnimationFrame(() => { drawQueued = false; drawNow(); });
  }
  function drawNow() {
    const k = transform.k;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.void; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * transform.x, dpr * transform.y);
    ctx.fillStyle = C.sea; ctx.fill(spherePath);
    ctx.strokeStyle = "rgba(233,228,216,0.05)"; ctx.lineWidth = 0.6 / k; ctx.stroke(gratPath);
    ctx.fillStyle = C.land; ctx.fill(landPath);

    // view box in base coords for culling
    const x0 = -transform.x / k, y0 = -transform.y / k, x1 = (W - transform.x) / k, y1 = (H - transform.y) / k;
    const inView = (b) => !(b[1][0] < x0 || b[0][0] > x1 || b[1][1] < y0 || b[0][1] > y1);

    ctx.lineJoin = "round";
    for (const o of visible) {
      if (o.rel || !inView(o.bounds)) continue;
      ctx.globalAlpha = 0.86; ctx.fillStyle = o.color; ctx.fill(o.path);
      ctx.globalAlpha = 1; ctx.strokeStyle = "rgba(10,18,25,0.85)"; ctx.lineWidth = 0.9 / k; ctx.stroke(o.path);
    }
    if (showRel) {
      ctx.setLineDash([5 / k, 4 / k]);
      for (const o of visible) {
        if (!o.rel || !inView(o.bounds)) continue;
        ctx.strokeStyle = o.color; ctx.lineWidth = 2 / k; ctx.stroke(o.path);
      }
      ctx.setLineDash([]);
    }
    if (hovered && hovered !== selected && visible.includes(hovered)) {
      ctx.strokeStyle = "rgba(233,228,216,0.75)"; ctx.lineWidth = 1.4 / k; ctx.stroke(hovered.path);
    }
    if (selected && visible.includes(selected)) {
      ctx.strokeStyle = C.brass; ctx.lineWidth = 2.4 / k; ctx.stroke(selected.path);
    }
    ctx.strokeStyle = "rgba(233,228,216,0.18)"; ctx.lineWidth = 1 / k; ctx.stroke(spherePath);

    // labels in screen space
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const boxes = [];
    const cand = visible.filter(o => !o.rel && o.centroid && isFinite(o.centroid[0])).sort((a, b) => b.labelArea - a.labelArea);
    for (const o of cand) {
      const sx = o.centroid[0] * k + transform.x, sy = o.centroid[1] * k + transform.y;
      if (sx < -50 || sx > W + 50 || sy < -20 || sy > H + 20) continue;
      const lin = Math.sqrt(o.labelArea) * k;
      const size = Math.min(20, (lin * 0.95) / (o.label.length * 0.56));
      if (size < 9) continue;
      ctx.font = `600 ${size.toFixed(1)}px ${getComputedStyle(document.body).fontFamily}`;
      const w = ctx.measureText(o.label).width, h = size * 1.2;
      const b = [sx - w / 2 - 2, sy - h / 2, sx + w / 2 + 2, sy + h / 2];
      if (boxes.some(q => !(b[2] < q[0] || b[0] > q[2] || b[3] < q[1] || b[1] > q[3]))) continue;
      boxes.push(b);
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(10,18,25,0.7)"; ctx.strokeText(o.label, sx, sy);
      ctx.fillStyle = C.ink; ctx.fillText(o.label, sx, sy);
    }
  }

  // ---------- sparkline ----------
  const spark = $("spark"), sctx = spark.getContext("2d");
  let SW = 0, SH = 0;
  const maxCount = Math.max(...counts);
  function sizeSpark() {
    const r = spark.getBoundingClientRect();
    SW = r.width; SH = r.height;
    spark.width = Math.round(SW * dpr); spark.height = Math.round(SH * dpr);
    drawSpark();
  }
  // the range input's thumb inset: approximate so the marker lines up with the thumb
  const THUMB = 8;
  const xOf = (y) => THUMB + (y - MIN_Y) / (MAX_Y - MIN_Y) * (SW - 2 * THUMB);
  function drawSpark() {
    if (!SW) return;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, SW, SH);
    // play range band
    sctx.fillStyle = "rgba(217,169,91,0.10)";
    sctx.fillRect(xOf(rangeFrom), 0, Math.max(1, xOf(rangeTo) - xOf(rangeFrom)), SH);
    sctx.beginPath();
    sctx.moveTo(xOf(MIN_Y), SH);
    const step = Math.max(1, Math.floor(NY / SW / 2));
    for (let i = 0; i < NY; i += step) sctx.lineTo(xOf(MIN_Y + i), SH - (counts[i] / maxCount) * (SH - 4));
    sctx.lineTo(xOf(MAX_Y), SH); sctx.closePath();
    sctx.fillStyle = "rgba(233,228,216,0.16)"; sctx.fill();
    sctx.strokeStyle = "rgba(233,228,216,0.45)"; sctx.lineWidth = 1; sctx.stroke();
    const cx = xOf(year);
    sctx.fillStyle = C.brass; sctx.fillRect(cx - 1, 0, 2, SH);
  }

  // ---------- year control ----------
  const slider = $("slider");
  function setYear(y, dir) {
    y = Math.max(MIN_Y, Math.min(MAX_Y, Math.round(y)));
    if (y === 0) y = (dir || 1) > 0 ? 1 : -1;
    year = y;
    slider.value = y;
    const [n, era] = fmt(y);
    $("yearLabel").innerHTML = `${n}<small>${era}</small>`;
    computeVisible();
    const polities = visible.filter(o => !o.rel).length;
    $("countLabel").textContent = `${polities} ${polities === 1 ? "polity" : "polities"} on the map`;
    if (selected) {
      // follow the same polity through time if it still exists
      const row = spans.get(selected.name)?.rows.find(o => o.from <= year && year <= o.to);
      selected = row || null;
      if (selected) ensure(selected);
      renderInfo();
    }
    drawSpark();
    draw();
  }
  slider.addEventListener("input", () => { pause(); setYear(+slider.value, +slider.value - year); writeHash(); });

  function nextChange(dir) {
    if (dir > 0) { const c = changes.find(c => c > year); return c ?? MAX_Y; }
    for (let i = changes.length - 1; i >= 0; i--) if (changes[i] < year) return changes[i];
    return MIN_Y;
  }
  $("prevYear").onclick = () => { pause(); setYear(year - 1, -1); writeHash(); };
  $("nextYear").onclick = () => { pause(); setYear(year + 1, 1); writeHash(); };
  $("prevChange").onclick = () => { pause(); setYear(nextChange(-1), -1); writeHash(); };
  $("nextChange").onclick = () => { pause(); setYear(nextChange(1), 1); writeHash(); };

  // ---------- range ----------
  let rangeFrom = -800, rangeTo = 500;
  const fromIn = $("fromYear"), toIn = $("toYear"), preset = $("preset");
  function setRange(a, b) {
    a = Math.max(MIN_Y, Math.min(MAX_Y, a | 0)); b = Math.max(MIN_Y, Math.min(MAX_Y, b | 0));
    if (a > b) [a, b] = [b, a];
    rangeFrom = a; rangeTo = b; fromIn.value = a; toIn.value = b;
    drawSpark();
  }
  preset.addEventListener("change", () => {
    if (preset.value === "custom") { fromIn.focus(); return; }
    const [a, b] = preset.value.split(",").map(Number);
    setRange(a, b);
    if (year < a || year > b) setYear(a, 1);
  });
  [fromIn, toIn].forEach(el => el.addEventListener("change", () => { preset.value = "custom"; setRange(+fromIn.value, +toIn.value); }));

  // ---------- playback ----------
  let playing = false, last = 0, acc = 0;
  const playBtn = $("playBtn"), speedSel = $("speed");
  function play() {
    if (playing) return;
    if (year >= rangeTo || year < rangeFrom) setYear(rangeFrom, 1);
    playing = true; last = performance.now(); acc = 0;
    playBtn.textContent = "❚❚ Pause";
    requestAnimationFrame(tick);
  }
  function pause() {
    if (!playing) return;
    playing = false; playBtn.textContent = "▶ Play"; writeHash();
  }
  function tick(ts) {
    if (!playing) return;
    const dt = Math.min(0.25, (ts - last) / 1000); last = ts;
    const sp = speedSel.value;
    let ny = null;
    if (sp === "changes") {
      acc += dt;
      if (acc >= 0.6) { acc = 0; ny = nextChange(1); if (year >= rangeTo || ny > rangeTo) ny = rangeTo + 1; }
    } else {
      acc += dt * +sp;
      if (acc >= 1) { const n = Math.floor(acc); acc -= n; ny = year + n; if (year < 0 && ny >= 0) ny += 1; }
    }
    if (ny !== null) {
      if (ny > rangeTo) {
        if ($("loop").checked) ny = rangeFrom; else { setYear(rangeTo, 1); pause(); return; }
      }
      setYear(ny, 1);
    }
    requestAnimationFrame(tick);
  }
  playBtn.onclick = () => playing ? pause() : play();

  // ---------- zoom & interaction ----------
  const zoom = d3.zoom().scaleExtent([1, 40])
    .on("start", (e) => { if (e.sourceEvent && e.sourceEvent.type !== "wheel") canvas.classList.add("dragging"); })
    .on("zoom", (e) => { transform = e.transform; draw(); })
    .on("end", () => canvas.classList.remove("dragging"));
  const sel = d3.select(canvas).call(zoom).on("dblclick.zoom", null);

  // hit testing in base coordinates
  const hitCtx = document.createElement("canvas").getContext("2d");
  function hitAt(cx, cy) {
    const bx = (cx - transform.x) / transform.k, by = (cy - transform.y) / transform.k;
    // smallest polity first so enclaves win
    let best = null;
    for (const o of visible) {
      if (o.rel) continue;
      const b = o.bounds;
      if (bx < b[0][0] || bx > b[1][0] || by < b[0][1] || by > b[1][1]) continue;
      if (hitCtx.isPointInPath(o.path, bx, by) && (!best || o.area < best.area)) best = o;
    }
    return best;
  }
  const tip = $("tip");
  let downAt = null;
  canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
  canvas.addEventListener("pointerup", (e) => {
    if (!downAt) return;
    const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
    downAt = null;
    if (moved > 5) return;
    selected = hitAt(e.clientX, e.clientY);
    renderInfo(); draw();
  });
  let hoverQueued = false, lastMove = null;
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    lastMove = e;
    if (hoverQueued) return; hoverQueued = true;
    requestAnimationFrame(() => {
      hoverQueued = false;
      const h = hitAt(lastMove.clientX, lastMove.clientY);
      if (h !== hovered) { hovered = h; draw(); }
      if (h) {
        tip.textContent = h.label; tip.style.display = "block";
        tip.style.left = Math.min(W - tip.offsetWidth - 8, lastMove.clientX + 14) + "px";
        tip.style.top = (lastMove.clientY + 14) + "px";
      } else tip.style.display = "none";
    });
  });
  canvas.addEventListener("pointerleave", () => { hovered = null; tip.style.display = "none"; draw(); });

  function renderInfo() {
    const box = $("info");
    if (!selected) { box.classList.remove("show"); return; }
    const o = selected, s = spans.get(o.name), p = o.p;
    $("infoName").innerHTML = `<span class="swatch" style="background:${o.color}"></span>`;
    $("infoName").appendChild(document.createTextNode(o.label));
    const rows = [
      ["Exists", `${fmtS(s.from)} – ${fmtS(s.to)}`],
      ["These borders", `${fmtS(o.from)} – ${fmtS(o.to)}`],
      ["Area", p.Area ? `${Math.round(p.Area).toLocaleString()} km²` : "—"],
    ];
    if (p.MemberOf) rows.push(["Part of", p.MemberOf.replace(/[()]/g, "").split(";").join(", ")]);
    const dlEl = $("infoDl"); dlEl.innerHTML = "";
    for (const [a, b] of rows) { const dt = document.createElement("dt"); dt.textContent = a; const dd = document.createElement("dd"); dd.textContent = b; dlEl.append(dt, dd); }
    const links = $("infoLinks"); links.innerHTML = "";
    const add = (href, text) => { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = text; links.appendChild(a); };
    if (p.Wikipedia) add("https://en.wikipedia.org/wiki/" + encodeURIComponent(p.Wikipedia.replace(/ /g, "_")), "Wikipedia ↗");
    if (p.Wikidata) add("https://www.wikidata.org/wiki/" + encodeURIComponent(p.Wikidata), "Wikidata ↗");
    const zb = document.createElement("a"); zb.href = "#"; zb.textContent = "Zoom to"; zb.onclick = (e) => { e.preventDefault(); zoomTo(o); }; links.appendChild(zb);
    box.classList.add("show");
  }
  $("infoClose").onclick = () => { selected = null; renderInfo(); draw(); };

  function zoomTo(o) {
    ensure(o);
    const [[a, b], [c, d]] = o.bounds;
    const k = Math.max(1, Math.min(40, 0.75 / Math.max((c - a) / W, (d - b) / H)));
    const t = d3.zoomIdentity.translate(W / 2, H / 2 - 40).scale(k).translate(-(a + c) / 2, -(b + d) / 2);
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    (reduce ? sel : sel.transition().duration(900)).call(zoom.transform, t);
  }

  $("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = $("searchInput").value.trim().toLowerCase();
    if (!q) return;
    let name = [...spans.keys()].find(n => n.toLowerCase() === q) || [...spans.keys()].find(n => !n.startsWith("(") && n.toLowerCase().includes(q));
    if (!name) { $("searchInput").setCustomValidity("No polity by that name. Try a shorter word, like Rome or Ming."); $("searchInput").reportValidity(); return; }
    $("searchInput").setCustomValidity("");
    pause();
    const s = spans.get(name);
    const row = s.rows.find(o => o.from <= year && year <= o.to) || s.rows.reduce((a, b) => (ensure(a).area >= ensure(b).area ? a : b));
    if (!(row.from <= year && year <= row.to)) setYear(row.from, 1);
    selected = row; renderInfo(); zoomTo(row); writeHash();
  });
  $("searchInput").addEventListener("input", () => $("searchInput").setCustomValidity(""));

  $("showRel").addEventListener("change", (e) => { showRel = e.target.checked; computeVisible(); draw(); });

  window.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea")) return;
    if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); pause(); setYear(e.shiftKey ? nextChange(1) : year + 1, 1); writeHash(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); pause(); setYear(e.shiftKey ? nextChange(-1) : year - 1, -1); writeHash(); }
  });

  // ---------- shareable year via #y117 / #y-500 ----------
  function writeHash() { try { history.replaceState(null, "", "#y" + year); } catch (e) {} }
  function readHash() { const m = /^#y(-?\d+)$/.exec(location.hash); return m ? +m[1] : null; }
  window.addEventListener("hashchange", () => { const y = readHash(); if (y !== null) setYear(y, 1); });

  // ---------- go ----------
  setRange(-800, 500);
  resize();
  window.addEventListener("resize", () => { resize(); computeVisible(); });
  setYear(readHash() ?? 117, 1);
  $("loading").remove();
})();
</script>
</body>
</html>
